<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SPASIS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='spasis-icon-512.png') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <img src="{{ url_for('static', filename='spasis-logo.png') }}" alt="SPASIS - Spatial Information System" class="login-logo-full">

        <div class="login-heading">User Login</div>
        <p class="login-note">Sign in to access the SPASIS Locator.</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" autocomplete="on">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                    <!-- eye (show) -->
                    <svg id="eyeOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- eye-off (hide) -->
                    <svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="login-footer">GIS • GPS • Mapping • Field QA</div>
    </div>

    <script>
    const pwd = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeOff = document.getElementById('eyeOff');

    toggleBtn.addEventListener('click', function () {
        const show = pwd.type === 'password';
        pwd.type = show ? 'text' : 'password';
        eyeOpen.style.display = show ? 'none' : 'block';
        eyeOff.style.display = show ? 'block' : 'none';
        toggleBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
</script>
</body>
</html>
